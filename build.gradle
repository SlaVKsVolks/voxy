plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name + "-neoforge"
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases/' }
    maven { url = 'https://maven.su5ed.dev/releases' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    exclusiveContent {
        forRepository {
            ivy {
                name = 'github'
                url = 'https://github.com/'
                patternLayout {
                    artifact '/[organisation]/[module]/releases/download/[revision]/[module]-[revision]-[classifier].[ext]'
                }
                metadataSources {
                    artifact()
                }
            }
        }
        filter {
            includeModuleByRegex('[^\\.]+', 'nvidium')
        }
    }
}

def gitCommitHash = { ->
    try {
        ExecOutput result = providers.exec {
            commandLine = ['git', 'rev-parse', 'HEAD']
            ignoreExitValue = true
        }
        if (result.getResult().get().getExitValue() != 0) {
            return '<UnknownCommit>'
        }
        return result.standardOutput.asText.get().strip()
    } catch (Exception e) {
        return '<UnknownCommit>'
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        java {
            exclude 'me/cortex/voxy/client/config/ModMenuIntegration.java'
            exclude 'me/cortex/voxy/client/mixin/flashback/**'
            exclude 'me/cortex/voxy/commonImpl/mixin/chunky/MixinFabricWorld.java'
        }
        resources {
            exclude 'fabric.mod.json'
            exclude 'voxy.accesswidener'
        }
    }
}

neoForge {
    version = project.findProperty('neo_version') ?: '21.1.224'
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'voxy.neoforgePort', 'true'
            jvmArgument '-Xmx8G'
        }
    }

    mods {
        voxy {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    compileOnly files('../../ThirdParty/sodium-source/build/api/sodium-neoforge-0.8.12-beta.3-backport.1+mc1.21.1-api.jar')
    compileOnly files('../../ThirdParty/sodium-source/neoforge/build/libs/sodium-neoforge-0.8.12-beta.3-backport.1+mc1.21.1-mod.jar')
    runtimeOnly files('../../ThirdParty/sodium-source/neoforge/build/libs/sodium-neoforge-0.8.12-beta.3-backport.1+mc1.21.1-mod.jar')

    compileOnly files('../../ThirdParty/iris-source/build/libs/iris-neoforge-1.10.7-snapshot+mc1.21.1-local.jar')
    runtimeOnly files('../../ThirdParty/iris-source/build/libs/iris-neoforge-1.10.7-snapshot+mc1.21.1-local.jar')

    compileOnly 'drouarb:nvidium:0.4.1-beta9:1.21-1.21.1@jar'
    compileOnly 'maven.modrinth:sodium-extra:mc1.21.1-0.6.0+fabric'
    compileOnly 'maven.modrinth:chunky:1.4.23-fabric'
    compileOnly 'maven.modrinth:vivecraft:1.21.9-1.3.2-fabric'
    implementation platform('org.lwjgl:lwjgl-bom:3.3.3')
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-lmdb'
    implementation 'org.lwjgl:lwjgl-zstd'
    jarJar 'org.lwjgl:lwjgl-lmdb:3.3.3'
    jarJar 'org.lwjgl:lwjgl-zstd:3.3.3'
    runtimeOnly 'org.lwjgl:lwjgl:3.3.3:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-lmdb:3.3.3:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-zstd:3.3.3:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-lmdb:3.3.3:natives-linux'
    runtimeOnly 'org.lwjgl:lwjgl-zstd:3.3.3:natives-linux'
    jarJar 'org.lwjgl:lwjgl-lmdb:3.3.3:natives-windows'
    jarJar 'org.lwjgl:lwjgl-zstd:3.3.3:natives-windows'
    jarJar 'org.lwjgl:lwjgl-lmdb:3.3.3:natives-linux'
    jarJar 'org.lwjgl:lwjgl-zstd:3.3.3:natives-linux'

    implementation 'redis.clients:jedis:5.1.0'
    implementation 'org.rocksdb:rocksdbjni:10.2.1'
    implementation 'org.apache.commons:commons-pool2:2.12.0'
    implementation 'org.lz4:lz4-java:1.8.0'
    implementation 'org.tukaani:xz:1.10'
    runtimeOnly 'org.xerial:sqlite-jdbc:3.49.1.0'
    jarJar 'redis.clients:jedis:5.1.0'
    jarJar 'org.rocksdb:rocksdbjni:10.2.1'
    jarJar 'org.apache.commons:commons-pool2:2.12.0'
    jarJar 'org.lz4:lz4-java:1.8.0'
    jarJar 'org.tukaani:xz:1.10'
    jarJar 'org.xerial:sqlite-jdbc:3.49.1.0'
}

processResources {
    def hash = gitCommitHash()
    def shortHash = hash == '<UnknownCommit>' ? hash : hash.substring(0, Math.min(7, hash.length()))
    inputs.properties(
            'version': project.version,
            'commit': shortHash
    )
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version, 'commit': shortHash
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.deprecation = true
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
